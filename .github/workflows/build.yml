name: Build

on:
  pull_request:
  push:
    branches: [main, generation-3]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No DB Theme keys in CI: the Generation 3 build falls back to the default theme.
      - run: npm ci
      - run: npm run build
